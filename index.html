<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4a39">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مصحف الأمة">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>مصحف الأمة</title>
<meta name="description" content="استمع إلى المصحف الشريف بالروايات العشرين صفحةً صفحة، مع هوامش القراءات العشر.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran&display=swap" rel="stylesheet">
<style>
:root{
  --green:#1f4a39; --green2:#2c6650; --gold:#c49a3e; --gold2:#e6c97f; --maroon:#8e1b1b;
  --paper:#fbf6e9; --paper2:#f3ead3; --ink:#1d1a14; --muted:#7a6f5a; --bg:#efe7d3; --card:#fffdf6;
  --shadow:0 10px 30px rgba(40,30,10,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#f4ecd6; --bg:#14211b; --card:#1b2c24; --ink:#efe6cf; --muted:#b9ad90; --paper2:#e9dfc2;
}}
:root[data-theme="dark"]{--paper:#f4ecd6; --bg:#14211b; --card:#1b2c24; --ink:#efe6cf; --muted:#b9ad90; --paper2:#e9dfc2}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Amiri,serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.star-bg{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 20 20'><rect width='20' height='20' fill='%231f4a39'/><g fill='none' stroke='%23c49a3e' stroke-width='.9'><rect x='5' y='5' width='10' height='10'/><rect x='5' y='5' width='10' height='10' transform='rotate(45 10 10)'/></g><circle cx='10' cy='10' r='1.4' fill='%23e6c97f'/></svg>")}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
  background:var(--green);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.brand{font-weight:700;font-size:18px;white-space:nowrap;line-height:1.25}
.brand small{display:block;font-size:11px;font-weight:400;color:var(--gold2);margin-top:-3px}
.top .sp{flex:1}
.chip{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(230,201,127,.5);
  font-size:15px;font-weight:700;color:#fff;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--gold2)}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1)}
.icon-btn svg{width:20px;height:20px;fill:#fff}

/* page */
main{max-width:620px;margin:0 auto;padding:14px 12px 150px}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--muted);padding:0 4px 8px;font-weight:700}
.meta .sura{color:var(--green);font-size:17px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .meta .sura{color:var(--gold2)}}
.stage{perspective:1600px}
.leaf{position:relative;border-radius:10px;padding:9px;box-shadow:var(--shadow);transform-origin:center;transition:transform .45s cubic-bezier(.3,.7,.3,1),opacity .45s}
.leaf .inner{background:var(--paper);border-radius:4px;border:2px solid var(--gold);outline:1px solid var(--green);outline-offset:-6px;
  padding:16px 14px;min-height:60vh;display:flex;align-items:center;justify-content:center;position:relative}
.leaf img{width:100%;height:auto;display:block;mix-blend-mode:multiply;user-select:none;-webkit-user-drag:none}
.leaf.out-next{transform:rotateY(-80deg) translateX(-10%);opacity:0}
.leaf.out-prev{transform:rotateY(80deg) translateX(10%);opacity:0}
.leaf.in-next{transform:rotateY(70deg) translateX(10%);opacity:0;transition:none}
.leaf.in-prev{transform:rotateY(-70deg) translateX(-10%);opacity:0;transition:none}
.pno{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);width:34px;height:34px;display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--green)}
.pno::before,.pno::after{content:"";position:absolute;inset:4px;background:var(--paper);border:1.5px solid var(--gold);z-index:-1}
.pno::after{transform:rotate(45deg)}
.pno{isolation:isolate}
.mnote{text-align:center;font-size:12px;color:#8a6a1f;margin:22px 12px -6px;line-height:1.6}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;pointer-events:none}

/* notes */
.notes{margin-top:28px;background:var(--card);border-radius:12px;border:1px solid rgba(196,154,62,.45);overflow:hidden}
.notes summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 14px;font-weight:700;font-size:16px;color:var(--maroon);cursor:pointer}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .notes summary{color:var(--gold2)}}
.notes summary::-webkit-details-marker{display:none}
.notes summary .chev{margin-inline-start:auto;transition:transform .2s}
.notes[open] summary .chev{transform:rotate(180deg)}
.nbody{padding:2px 16px 16px;font-size:17px;line-height:1.85;text-align:justify}
.nbody p{margin-bottom:.25em}
.nbody p.h{display:inline-block;margin:.5em 0 .15em;padding:0 10px;border-radius:6px;background:var(--maroon);color:#fff;font-weight:700;font-size:.9em}
.nbody p.h *{color:#fff!important}
.nbody .red{color:var(--maroon);font-weight:700}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nbody .red{color:#e8a39a}}
.nbody .ay{font-family:"Amiri Quran",Amiri,serif;color:var(--green2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nbody .ay{color:var(--gold2)}}

/* player */
.player{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);
  background:var(--green);color:#fff;box-shadow:0 -4px 18px rgba(0,0,0,.25)}
.player .wrap{max-width:620px;margin:0 auto}
.bar{height:5px;border-radius:5px;background:rgba(255,255,255,.18);overflow:hidden;cursor:pointer;direction:ltr}
.bar i{display:block;height:100%;width:0;background:var(--gold2);transform-origin:right}
.times{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.7);margin-top:3px;direction:ltr}
.ctrls{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:2px}
.ctrls .nav{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08)}
.ctrls .nav svg{width:22px;height:22px;fill:#fff}
.play{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:var(--gold);box-shadow:0 0 0 4px rgba(230,201,127,.25)}
.play svg{width:28px;height:28px;fill:var(--green)}
.auto{position:absolute;display:flex;align-items:center;gap:6px;font-size:13px;color:rgba(255,255,255,.85)}
.ctrls{position:relative}
.auto.l{left:0}.auto.r{right:0}
.sw{width:36px;height:20px;border-radius:20px;background:rgba(255,255,255,.25);position:relative;transition:.2s}
.sw::after{content:"";position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--gold)}.sw.on::after{right:18px}
.status{text-align:center;font-size:13px;color:var(--gold2);min-height:18px;margin-top:2px}
.status a{color:#fff}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:.25s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:86vh;overflow:auto;background:var(--card);color:var(--ink);
  border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.3,.7,.3,1);padding:0 16px calc(env(safe-area-inset-bottom) + 20px)}
.sheet.show{transform:none}
.sheet .grab{position:sticky;top:0;background:var(--card);padding:10px 0 8px;z-index:1}
.sheet .grab::before{content:"";display:block;width:44px;height:5px;border-radius:5px;background:rgba(127,110,80,.35);margin:0 auto 10px}
.sheet .x{position:absolute;left:0;top:14px;width:34px;height:34px;border-radius:50%;background:var(--paper2);color:#3a3326;font-size:16px}
.sheet h2{font-size:20px;color:var(--green);text-align:center}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sheet .x{position:absolute;left:0;top:14px;width:34px;height:34px;border-radius:50%;background:var(--paper2);color:#3a3326;font-size:16px}
.sheet h2{color:var(--gold2)}}
.qari{margin-top:14px}
.qari h3{font-size:14px;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.qari h3::after{content:"";flex:1;height:1px;background:rgba(196,154,62,.4)}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rbtn{padding:11px 10px;border-radius:12px;border:1.5px solid rgba(196,154,62,.5);background:var(--paper);color:#1d1a14;font-size:17px;font-weight:700;
  display:flex;align-items:center;justify-content:space-between}
.rbtn small{font-size:11px;font-weight:400;color:#8a7e66}
.rbtn.cur{background:var(--green);color:#fff;border-color:var(--green)}.rbtn.cur small{color:var(--gold2)}
.rbtn.soon{opacity:.55}
.jump{display:flex;gap:8px;margin:10px 0 6px}
.jump input{flex:1;font:inherit;font-size:20px;padding:10px 12px;border-radius:12px;border:1.5px solid rgba(196,154,62,.6);background:var(--paper);color:#1d1a14;text-align:center}
.jump button{padding:0 20px;border-radius:12px;background:var(--green);color:#fff;font-size:17px;font-weight:700}
.tabs{display:flex;gap:6px;margin:12px 0 8px}
.tabs button{flex:1;padding:8px;border-radius:10px;background:var(--paper2);color:#3a3326;font-weight:700;font-size:15px}
.tabs button.on{background:var(--maroon);color:#fff}
.list{display:grid;grid-template-columns:1fr;gap:4px}
.list button{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid rgba(196,154,62,.25);font-size:17px;text-align:right}
.list .n{width:30px;height:30px;flex:none;display:grid;place-items:center;font-size:12px;color:var(--green);position:relative;isolation:isolate;font-weight:700}
.list .n::before{content:"";position:absolute;inset:4px;border:1.2px solid var(--gold);transform:rotate(45deg);z-index:-1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .list .n{color:var(--gold2)}}
.list .pg{margin-inline-start:auto;font-size:13px;color:var(--muted)}
.jgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.jgrid button{padding:10px 0;border-radius:10px;background:var(--paper);border:1px solid rgba(196,154,62,.45);font-weight:700;color:#1d1a14}

/* welcome */
.welcome{text-align:center;padding:10px 6px 0}
.welcome .orn{height:10px;border-radius:4px;margin:6px auto 14px;width:120px}
.welcome h1{font-size:28px;color:var(--green);line-height:1.3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .welcome h1{color:var(--gold2)}}
.welcome p{color:var(--muted);font-size:16px;margin-top:6px}
.inst{position:fixed;left:12px;right:12px;bottom:calc(150px + env(safe-area-inset-bottom));z-index:61;background:var(--card);color:var(--ink);border:1.5px solid var(--gold);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:14px;line-height:1.5}
.inst[hidden]{display:none}
.inst img{width:40px;height:40px;border-radius:9px}
.inst .t{flex:1}
.inst .go{background:var(--green);color:#fff;border-radius:999px;padding:7px 14px;font-weight:700}
.inst .x{font-size:20px;color:var(--muted);padding:0 4px}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--maroon);color:#fff;padding:8px 16px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
.fallback{width:100%;height:80px;border:0;border-radius:8px;margin-top:6px;background:#fff}

/* opening screen */
.splash{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 35%,#2c6650,#1f4a39 70%);display:grid;place-items:center;padding:22px;transition:opacity .6s ease}
.splash.hide{opacity:0;pointer-events:none}
.sp-card{width:min(420px,100%);border:2px solid var(--gold);outline:1px solid var(--gold);outline-offset:6px;border-radius:14px;padding:34px 22px 26px;text-align:center;color:#fff}
.sp-logo{width:132px;height:132px;display:block;margin:-6px auto 2px;filter:drop-shadow(0 4px 14px rgba(0,0,0,.35))}
.brand-logo{width:30px;height:30px;vertical-align:middle;margin-left:8px;float:right;margin-top:2px}
.sp-orn{color:var(--gold2);font-size:22px;letter-spacing:6px}
.sp-t1{font-size:26px;font-weight:700;color:var(--gold2);margin:12px 0 18px;line-height:1.5}
.sp-lbl{font-size:15px;color:#e9dfc2;line-height:1.6}
.sp-name{font-size:24px;font-weight:700;margin:2px 0 16px;line-height:1.5}
.sp-name2{font-size:21px;font-weight:700;margin:2px 0 6px;line-height:1.5}
.sp-pair{display:flex;align-items:stretch;justify-content:center;gap:14px;margin-top:6px}
.sp-pair>div:not(.sp-sep){flex:1;display:flex;flex-direction:column;align-items:center}
.sp-pair .sp-name2{font-size:19px;margin:0}
.sp-sep{width:1px;background:var(--gold);opacity:.7}
.sp-rule{width:120px;height:1px;background:var(--gold);margin:4px auto 16px;opacity:.8}
.sp-skip{margin-top:22px;font-size:13px;color:var(--gold2);opacity:.85}
@media (prefers-reduced-motion:reduce){.splash{transition:none}}
</style>
</head>
<body>
<div class="splash" id="splash" role="dialog" aria-label="افتتاحية المصحف">
  <div class="sp-card">
    <img class="sp-logo" src="icons/logo-240.png" alt="مصحف الأمة">
    <div class="sp-t1">الجمع الصوتي للقرآن الكريم</div>
    <div class="sp-lbl">بصوت الشيخ</div>
    <div class="sp-name">أحمد المعصراوي</div>
    <div class="sp-rule"></div>
    <div class="sp-lbl">إعداد ومراجعة</div>
    <div class="sp-pair">
      <div><span class="sp-lbl">الشيخ</span><span class="sp-name2">أحمد المعصراوي</span></div>
      <div class="sp-sep"></div>
      <div><span class="sp-lbl">الشيخ</span><span class="sp-name2">عبدالفتاح هيكل</span></div>
    </div>
    <div class="sp-skip">اضغط للدخول</div>
  </div>
</div>
<script>(function(){const sp=document.getElementById('splash');let done=false;
function hide(){if(done)return;done=true;sp.classList.add('hide');setTimeout(()=>sp.remove(),700)}
sp.addEventListener('click',hide);setTimeout(hide,4000)})();</script>

<header class="top">
  <div class="brand"><img class="brand-logo" src="icons/favicon-64.png" alt="">مصحف الأمة<small>القراءات العشر · الروايات العشرون</small></div>
  <div class="sp"></div>
  <button class="chip" id="riwBtn" aria-label="اختيار الرواية"><span class="dot"></span><span id="riwName">اختر الرواية</span></button>
  <button class="icon-btn" id="goBtn" aria-label="الانتقال إلى صفحة"><svg viewBox="0 0 24 24"><path d="M3 5h18v2H3zm0 6h18v2H3zm0 6h12v2H3z"/></svg></button>
</header>

<main>
  <div class="meta"><span class="sura" id="mSura"></span><span id="mJuz"></span></div>
  <div class="stage" id="stage">
    <div class="leaf star-bg" id="leaf">
      <div class="inner"><img id="pimg" alt=""><div class="loading" id="loading">جارٍ التحميل…</div></div>
      <div class="pno" id="pno"></div>
    </div>
  </div>
  <div class="mnote" id="mnote" hidden></div>
  <details class="notes" id="notes" hidden>
    <summary><span>هوامش القراءات لهذه الصفحة</span><svg class="chev" width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg></summary>
    <div class="nbody" id="nbody"></div>
  </details>
</main>

<footer class="player">
  <div class="wrap">
    <div class="bar" id="bar"><i id="barFill"></i></div>
    <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
    <div class="ctrls">
      <button class="auto r" id="autoBtn" aria-label="التشغيل المتواصل"><span class="sw on" id="autoSw"></span><span>متواصل</span></button>
      <button class="nav" id="prevBtn" aria-label="الصفحة السابقة"><svg viewBox="0 0 24 24"><path d="M8.6 7.4 10 6l6 6-6 6-1.4-1.4 4.6-4.6z"/></svg></button>
      <button class="play" id="playBtn" aria-label="تشغيل"><svg viewBox="0 0 24 24" id="playIco"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="nav" id="nextBtn" aria-label="الصفحة التالية"><svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg></button>
      <button class="auto l" id="themeBtn" aria-label="الوضع الليلي"><span>☾</span></button>
    </div>
    <div class="status" id="status"></div>
  </div>
</footer>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="riwSheet" aria-label="الروايات">
  <div class="grab"><button class="x" data-close aria-label="إغلاق">✕</button><h2>اختر الرواية</h2></div>
  <div id="riwList"></div>
</section>
<section class="sheet" id="goSheet" aria-label="الانتقال">
  <div class="grab"><button class="x" data-close aria-label="إغلاق">✕</button><h2>انتقل إلى</h2></div>
  <form class="jump" id="jumpForm"><input id="jumpIn" type="number" inputmode="numeric" min="1" max="604" placeholder="رقم الصفحة ١ – ٦٠٤"><button>اذهب</button></form>
  <div class="tabs"><button class="on" data-t="s">السور</button><button data-t="j">الأجزاء</button></div>
  <div id="goList"></div>
</section>
<div class="toast" id="toast"></div>
<div class="inst" id="inst" hidden><img src="icons/apple-touch-icon.png" alt=""><div class="t" id="instTxt">ثبّت «مصحف الأمة» على جهازك ليفتح كتطبيق</div><button class="go" id="instGo">تثبيت</button><button class="x" id="instX" aria-label="إغلاق">×</button></div>
<audio id="aud" preload="auto"></audio>

<script>
(()=>{
const $=id=>document.getElementById(id);
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const fmt=t=>{if(!isFinite(t))return '0:00';t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let D,N={},R=null,P=1,auto=true,wantPlay=false,busy=false;
const aud=$('aud');const nextAud=new Audio();nextAud.preload='auto';nextAud.muted=true;

const ICON_PLAY='<path d="M8 5v14l11-7z"/>';
const ICON_PAUSE='<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}
function audioUrl(r,p){
  if(!r||!r.audio) return null;
  if(r.audio.base&&p<=(r.audio.local||604)) return r.audio.base+String(p).padStart(3,'0')+'.mp3';
  if(r.audio.archive&&onArchive(r)) return 'https://archive.org/download/'+r.audio.archive+'/Page_'+String(p).padStart(3,'0')+'.mp3';
  if(r.audio.type==='drive') return null;
  if(r.audio.type==='url') return r.audio.pattern.replace('{p3}',String(p).padStart(3,'0')).replace('{p}',p);
  return null;
}
// recitations uploaded to archive.org (checked once; unknown = assume uploaded)
let ARCH=null;
function onArchive(r){return !!(r&&r.audio&&r.audio.archive)&&(ARCH===null||ARCH.has(r.audio.archive))}
function avail(r){return !!(r&&r.audio&&(r.audio.base||r.audio.type||onArchive(r)))}
function driveView(r,p){return r&&r.audio&&r.audio.type==='drive'&&r.audio.ids[String(p)]?'https://drive.google.com/file/d/'+r.audio.ids[String(p)]+'/view':null}
function ownImg(p){return !!(R&&R.mushaf&&R.mushaf!=='hafs'&&p<=(R.mpages||604))}
function imgUrl(p){const m=ownImg(p)?R.mushaf:'hafs';return 'pages/'+m+'/'+String(p).padStart(3,'0')+'.png'}
function renderMnote(){const el=$('mnote');if(!el)return;const fb=R&&R.id!=='hafs'&&!ownImg(P);
  el.hidden=!fb;if(fb)el.textContent=R.mushaf&&R.mushaf!=='hafs'?'صورة هذه الصفحة من مصحف حفص؛ صفحات مصحف رواية '+R.name+' متاحة حاليًا للصفحات ١–'+AR(R.mpages):'صورة الصفحة من مصحف حفص، ومصحف رواية '+R.name+' سيُضاف بإذن الله'}
function loadImg(){$('loading').style.display='grid';const img=$('pimg');img.onload=()=>{$('loading').style.display='none'};img.src=imgUrl(P);renderMnote()}

function syncUrl(){const u=new URL(location.href);u.searchParams.set('p',P);if(R)u.searchParams.set('r',R.id);history.replaceState(null,'',u);store.set('last',JSON.stringify({p:P,r:R&&R.id}))}

function renderMeta(){
  const [s,j]=D.pages[P-1];const sura=D.suras[s-1][2];
  $('mSura').textContent='سورة '+sura;$('mJuz').textContent='الجزء '+AR(j)+' · صفحة '+AR(P);
  $('pno').textContent=AR(P);
  const n=N[String(P)];$('notes').hidden=!n;if(n)$('nbody').innerHTML=n;
  document.title='صفحة '+AR(P)+' – سورة '+sura+(R?' – رواية '+R.name:'')+' | مصحف الأمة';
}
function setPlayIcon(){$('playIco').innerHTML=aud.paused?ICON_PLAY:ICON_PAUSE;$('playBtn').setAttribute('aria-label',aud.paused?'تشغيل':'إيقاف')}

function loadAudio(play){
  const url=audioUrl(R,P);
  $('status').innerHTML='';
  if(!R){aud.removeAttribute('src');$('status').textContent='اختر رواية للاستماع';return}
  if(!url){aud.removeAttribute('src');aud.load();const v=driveView(R,P);
    $('status').innerHTML=v?`هذه الصفحة تُسمع حاليًا من Drive – <a href="${v}" target="_blank" rel="noopener">افتح التلاوة</a>`:'تلاوة رواية '+R.name+(R.audio&&R.audio.local?' متاحة حاليًا للصفحات ١–'+AR(R.audio.local)+'، وبقية المصحف تُضاف قريبًا':' لهذه الصفحة تُضاف قريبًا بإذن الله');setPlayIcon();return}
  if(aud.dataset.src!==url){aud.dataset.src=url;aud.src=url;aud.load()}
  if(play){aud.play().catch(()=>{setPlayIcon()})}
  if('mediaSession' in navigator){
    navigator.mediaSession.metadata=new MediaMetadata({title:'صفحة '+P+' – سورة '+D.suras[D.pages[P-1][0]-1][2],artist:'رواية '+R.name+' – الشيخ أحمد المعصراوي',album:'مصحف الأمة',
      artwork:[{src:'icons/icon-192.png',sizes:'192x192',type:'image/png'},{src:'icons/icon-512.png',sizes:'512x512',type:'image/png'}]});
  }
  // fetch the next page's recitation in advance so continuous play does not stall in the background
  const nu=P<604?audioUrl(R,P+1):null;if(nu&&nextAud.dataset.src!==nu){nextAud.dataset.src=nu;nextAud.src=nu;nextAud.load()}
  // warm up next page image
  if(P<604){const i=new Image();i.src=imgUrl(P+1)}
}

function show(p,dir,play){
  p=Math.max(1,Math.min(604,p|0));
  if(p===P&&$('pimg').getAttribute('src'))return;
  const leaf=$('leaf');P=p;
  syncUrl();loadAudio(play);          // sound first, so it never waits for the page animation
  const swap=()=>{loadImg();renderMeta()};
  if(!dir||document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches){swap();return}
  leaf.classList.add(dir>0?'out-next':'out-prev');
  setTimeout(()=>{leaf.classList.remove('out-next','out-prev');leaf.classList.add(dir>0?'in-next':'in-prev');swap();
    void leaf.offsetWidth;leaf.classList.remove('in-next','in-prev')},260);
  window.scrollTo({top:0,behavior:'smooth'});
}

function setRiwaya(id,quiet){
  const r=D.riwayat.find(x=>x.id===id);if(!r)return;
  if(!avail(r)&&!r.mpages&&!quiet){toast('رواية '+r.name+' ستُضاف قريبًا بإذن الله');return}
  const was=!aud.paused,old=R&&R.id;R=r;$('riwName').textContent='رواية '+r.name;
  if(old!==r.id&&$('pimg').getAttribute('src'))loadImg();
  aud.dataset.src='';closeSheets();renderRiw();renderMeta();syncUrl();loadAudio(was||!quiet);
}

/* sheets */
function openSheet(id){$('scrim').classList.add('show');$(id).classList.add('show')}
function closeSheets(){$('scrim').classList.remove('show');document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('show'))}
function renderRiw(){
  const by={};D.riwayat.forEach(r=>(by[r.qari]=by[r.qari]||[]).push(r));
  $('riwList').innerHTML=Object.entries(by).map(([q,rs])=>`<div class="qari"><h3>قراءة ${q}</h3><div class="rgrid">${rs.map(r=>
    `<button class="rbtn${R&&R.id===r.id?' cur':''}${avail(r)||r.mpages?'':' soon'}" data-r="${r.id}"><span>${r.name}</span><small>${R&&R.id===r.id?'مختارة الآن':avail(r)?'متاحة':r.mpages?'المصحف فقط':'قريبًا'}</small></button>`).join('')}</div></div>`).join('');
}
function renderGo(t){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  if(t==='s') $('goList').innerHTML='<div class="list">'+D.suras.map(([n,p,name])=>`<button data-p="${p}"><span class="n">${AR(n)}</span><span>${name}</span><span class="pg">ص ${AR(p)}</span></button>`).join('')+'</div>';
  else{const first={};D.pages.forEach(([s,j],i)=>{if(!first[j])first[j]=i+1});
    $('goList').innerHTML='<div class="jgrid">'+Object.entries(first).map(([j,p])=>`<button data-p="${p}">${AR(j)}</button>`).join('')+'</div>'}
}

/* wiring */
$('riwBtn').onclick=()=>{renderRiw();openSheet('riwSheet')};
$('goBtn').onclick=()=>{renderGo('s');openSheet('goSheet');};
$('scrim').onclick=closeSheets;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheets);
$('riwList').onclick=e=>{const b=e.target.closest('[data-r]');if(b)setRiwaya(b.dataset.r)};
$('goList').onclick=e=>{const b=e.target.closest('[data-p]');if(b){closeSheets();show(+b.dataset.p,+b.dataset.p>P?1:-1,!aud.paused)}};
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(b)renderGo(b.dataset.t)};
$('jumpForm').onsubmit=e=>{e.preventDefault();const v=+$('jumpIn').value;if(v>=1&&v<=604){closeSheets();show(v,v>P?1:-1,!aud.paused)}else toast('أدخل رقمًا من ١ إلى ٦٠٤')};
$('nextBtn').onclick=()=>show(P+1,1,!aud.paused);
$('prevBtn').onclick=()=>show(P-1,-1,!aud.paused);
$('playBtn').onclick=()=>{
  if(!R){renderRiw();openSheet('riwSheet');return}
  if(!aud.getAttribute('src')){loadAudio(false);if(!aud.getAttribute('src'))return}
  aud.paused?aud.play().catch(err=>failed()):aud.pause();
};
$('autoBtn').onclick=()=>{auto=!auto;$('autoSw').classList.toggle('on',auto);store.set('auto',auto?'1':'0');toast(auto?'التشغيل المتواصل مفعّل':'التشغيل المتواصل متوقف')};
$('themeBtn').onclick=()=>{const d=document.documentElement;const cur=d.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  d.dataset.theme=cur==='dark'?'light':'dark';store.set('theme',d.dataset.theme)};
$('bar').onclick=e=>{if(!aud.duration)return;const r=e.currentTarget.getBoundingClientRect();aud.currentTime=(e.clientX-r.left)/r.width*aud.duration};

aud.addEventListener('play',setPlayIcon);aud.addEventListener('pause',setPlayIcon);
aud.addEventListener('timeupdate',()=>{$('tCur').textContent=fmt(aud.currentTime);$('tDur').textContent=fmt(aud.duration);
  $('barFill').style.width=(aud.duration?aud.currentTime/aud.duration*100:0)+'%'});
aud.addEventListener('waiting',()=>{$('status').textContent='جارٍ تحميل التلاوة…'});
aud.addEventListener('playing',()=>{$('status').textContent='رواية '+R.name+' · صفحة '+AR(P)});
aud.addEventListener('ended',()=>{store.set('pos','');if(auto&&P<604)show(P+1,1,true);else setPlayIcon()});
let lastSave=0,resumeAt=0;
function savePos(){if(R&&aud.currentTime>1)store.set('pos',JSON.stringify({p:P,r:R.id,t:Math.floor(aud.currentTime)}))}
aud.addEventListener('timeupdate',()=>{const n=Date.now();if(n-lastSave>4000){lastSave=n;savePos()}
  if('mediaSession' in navigator&&navigator.mediaSession.setPositionState&&aud.duration>0){try{navigator.mediaSession.setPositionState({duration:aud.duration,position:Math.min(aud.currentTime,aud.duration),playbackRate:1})}catch(e){}}});
aud.addEventListener('loadedmetadata',()=>{if(resumeAt>0&&resumeAt<aud.duration-2){aud.currentTime=resumeAt}resumeAt=0});
aud.addEventListener('play',()=>{if('mediaSession' in navigator)navigator.mediaSession.playbackState='playing'});
aud.addEventListener('pause',()=>{savePos();if('mediaSession' in navigator)navigator.mediaSession.playbackState='paused'});
addEventListener('pagehide',savePos);document.addEventListener('visibilitychange',()=>{if(document.hidden)savePos();else{loadImg();renderMeta()}});
function failed(){
  if((aud.getAttribute('src')||'').includes('archive.org')){$('status').textContent='تلاوة هذه الصفحة برواية '+R.name+' لم تكتمل بعد، تُضاف قريبًا';setPlayIcon();return}
  const v=driveView(R,P);
  $('status').innerHTML='تعذّر التشغيل داخل الموقع'+(v?` – <a href="${v}" target="_blank" rel="noopener">افتح التلاوة في Drive</a>`:'');
  setPlayIcon();
}
aud.addEventListener('error',()=>{if(aud.getAttribute('src'))failed()});

if('mediaSession' in navigator){
  navigator.mediaSession.setActionHandler('nexttrack',()=>show(P+1,1,true));
  navigator.mediaSession.setActionHandler('previoustrack',()=>show(P-1,-1,true));
  try{navigator.mediaSession.setActionHandler('play',()=>aud.play());navigator.mediaSession.setActionHandler('pause',()=>aud.pause());
    navigator.mediaSession.setActionHandler('seekto',e=>{if(e.seekTime!=null)aud.currentTime=e.seekTime});
    navigator.mediaSession.setActionHandler('seekbackward',e=>{aud.currentTime=Math.max(0,aud.currentTime-(e.seekOffset||10))});
    navigator.mediaSession.setActionHandler('seekforward',e=>{aud.currentTime=Math.min(aud.duration||0,aud.currentTime+(e.seekOffset||10))})}catch(e){}
}
// swipe: finger moving right = next page (as turning an Arabic mushaf)
let sx=null,sy=0;
$('stage').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$('stage').addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)show(P+(dx>0?1:-1),dx>0?1:-1,!aud.paused)},{passive:true});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowLeft')show(P+1,1,!aud.paused);if(e.key==='ArrowRight')show(P-1,-1,!aud.paused);if(e.key===' '){e.preventDefault();$('playBtn').click()}});

/* boot */
const th=store.get('theme');if(th)document.documentElement.dataset.theme=th;
auto=store.get('auto')!=='0';$('autoSw').classList.toggle('on',auto);
Promise.all([fetch('data.json',{cache:'no-cache'}).then(r=>r.json()),fetch('notes.json',{cache:'no-cache'}).then(r=>r.json()).catch(()=>({}))]).then(([d,n])=>{
  D=d;N=n;
  fetch('https://archive.org/advancedsearch.php?q=identifier%3Aalmasrawi-qiraat-*&fl%5B%5D=identifier&rows=100&output=json')
    .then(r=>r.json()).then(j=>{ARCH=new Set(j.response.docs.map(x=>x.identifier));if(R&&!aud.getAttribute('src'))loadAudio(false)}).catch(()=>{});
  const q=new URLSearchParams(location.search);let last={};try{last=JSON.parse(store.get('last')||'{}')}catch(e){}
  // QR codes carry their own page/riwaya; otherwise reopen exactly where the listener stopped; first visit = Hafs
  let pos={};try{pos=JSON.parse(store.get('pos')||'{}')}catch(e){}
  const qp=+q.get('p')||0,qr=q.get('r');
  const rid=qr||last.r||'hafs';
  const page=qp||((!qr||qr===last.r)?last.p:0)||1;
  P=0;
  const r=D.riwayat.find(x=>x.id===rid)||D.riwayat.find(x=>x.id==='hafs');if(r){R=r;$('riwName').textContent='رواية '+r.name}
  if(pos.r===R.id&&pos.p===page&&pos.t>2)resumeAt=pos.t;
  show(page,0,false);
  setPlayIcon();
  if(resumeAt)setTimeout(()=>toast('اضغط ▶ لتكمل من حيث توقفت – صفحة '+AR(page)),1500);
  else if(!qp&&!last.p)setTimeout(()=>toast('اضغط ▶ للاستماع، واسحب الصفحة للتقليب'),4300);
});
/* install as an app */
let deferredInstall=null;
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
function showInst(txt,btn){if(standalone||store.get('instNo')==='1')return;$('instTxt').textContent=txt;$('instGo').hidden=!btn;$('inst').hidden=false}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;setTimeout(()=>showInst('ثبّت «مصحف الأمة» على جهازك ليفتح كتطبيق',true),6000)});
$('instGo').onclick=async()=>{$('inst').hidden=true;if(deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice.catch(()=>{});deferredInstall=null}};
$('instX').onclick=()=>{$('inst').hidden=true;store.set('instNo','1')};
addEventListener('appinstalled',()=>{$('inst').hidden=true;toast('تم تثبيت مصحف الأمة')});
if(ios&&!standalone)setTimeout(()=>showInst('لتثبيت التطبيق: اضغط زر المشاركة ⬆️ ثم «إضافة إلى الشاشة الرئيسية»',false),7000);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
</body>
